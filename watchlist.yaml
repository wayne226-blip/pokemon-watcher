# Pokémon stock watcher — what to watch.
# Edit products HERE, never in code. Secrets (Telegram token, chat id, ntfy
# topic) are NOT in this file: they come from GitHub secrets / env vars.
#
# shop_price = the normal shop price. Alerts fire up to over_price_tolerance
# above it (flagged as over); beyond that, daily report only. Leave it unset
# when the normal price isn't known yet — the alert then fires regardless.
#
# Total Cards products are read via search queries: each product's `query`
# must return its handle in the top 10 results. Verified 24 Oct 2026.

settings:
  cooldown_minutes: 30
  buy_now_cooldown_minutes: 5   # restock after a sell-out alerts again after this
  error_threshold: 5
  over_price_tolerance: 1000   # no limit (26 Oct): every price alerts, with "£X over shop price"
  not_seen_fallback_runs: 12
  sold_out_again_hours: 24
  report_hours: [9, 13, 17, 21]   # summaries to Telegram, UK time
  request_gap_seconds: 4

# Must-haves re-checked about once a minute between the 5-minute runs, through
# release week. Only stock news counts here; errors stay on the 5-minute pass.
# Switches itself off after `until` (London date). Empty `keys` = off.
fast_lane:
  until: 2026-11-13
  every_seconds: 60
  stop_after_seconds: 245   # the last round must FINISH by then, before the next trigger
  not_seen_fallback_runs: 1 # a must-have missing from search gets a direct look after 1 missed run
  keys:
    - tc-upc-day
    - tc-upc-night
    - tc-dr-etb
    - zatu-dr-etb
    - tgc-dr-etb
    - mm-dr-etb
    - tc-30th-etb
    - tgc-30th-etb
    - mm-30th-etb

# Whole shop collections: every SEALED product in them is watched
# automatically, including ones the shop adds later. Single cards, empty tins,
# loose stickers/art cards, coins and non-English stock are skipped.
collections:
  - shop: totalcards
    handle: pokemon-30th-celebration
  - shop: zatu
    handle: pokemon-tcg-30th-celebration
  # Zatu's whole-category collections, current sets only (titles must carry
  # one of the include words; "mega " keeps its space so Yanmega and Meganium don't match).
  # Add an older set by adding its name here, e.g. "prismatic evolutions".
  - shop: zatu
    handle: booster-boxes-pokemon
    include: &current_sets ["mega ", 30th, delta reign, chaos rising, pitch black, perfect order, ascended heroes, phantasmal flames]
    exclude: &skip_words [sticker, case]
  - shop: zatu
    handle: booster-packs-pokemon
    include: *current_sets
    exclude: *skip_words
  - shop: zatu
    handle: other-sealed-product-pokemon
    include: *current_sets
    exclude: *skip_words
  - shop: zatu
    handle: lumiose-city-mini-tin

# Price caps for collection products, by words in the product title. First
# match wins, so put specific words ("mini tin") before general ones ("tin").
# Over the cap = no alert, just shown in the summaries. No match = always alert.
price_caps: []   # no caps (26 Oct). Old values, if wanted back:
#  - {match: ultra premium, max: 160}
#  - {match: ultra-premium, max: 160}
#  - {match: premium collection, max: 60}
#  - {match: figure collection, max: 35}
#  - {match: build & battle, max: 25}
#  - {match: prerelease, max: 25}
#  - {match: checklane, max: 9}
#  - {match: 2 pack, max: 15}
#  - {match: 3 pack, max: 20}
#  - {match: 3-pack, max: 20}
#  - {match: triple blister, max: 20}
#  - {match: booster box, max: 170}
#  - {match: elite trainer box, max: 60}
#  - {match: mini tin, max: 22}
#  - {match: booster bundle, max: 30}
#  - {match: booster pack, max: 6}
#  - {match: binder, max: 55}
#  - {match: poster collection, max: 55}
#  - {match: battle deck, max: 25}
#  - {match: ex box, max: 35}
#  - {match: tin, max: 35}
#  - {match: tech sticker, max: 30}
#  - {match: blister, max: 30}

# Sets the Pokémon TCG API is asked about, to add set info, the chase cards
# and a card picture to BUY NOW alerts. Matched by name in the product title.
tcg_sets:
  - Delta Reign
  - 30th Celebration
  - Chaos Rising
  - Pitch Black
  - Perfect Order
  - Phantasmal Flames
  - Ascended Heroes
  - Prismatic Evolutions
  - Destined Rivals
  - Flowing Fists

