# Pokémon stock watcher — what to watch.
# Edit products HERE, never in code. Secrets (Telegram token, chat id, ntfy
# topic) are NOT in this file: they come from GitHub secrets / env vars.
#
# shop_price = the normal shop price. Alerts fire up to over_price_tolerance
# above it (flagged as over); beyond that, daily report only. Leave it unset
# when the normal price isn't known yet — the alert then fires regardless.
#
# Total Cards products are read via search queries: each product's `query`
# must return its handle in the top 10 results. Verified 24 Oct 2026.

settings:
  cooldown_minutes: 30
  error_threshold: 5
  over_price_tolerance: 0.25
  not_seen_fallback_runs: 12
  sold_out_again_hours: 24
  report_hours: [9, 13, 17, 21]   # summaries to Telegram, UK time
  request_gap_seconds: 4

