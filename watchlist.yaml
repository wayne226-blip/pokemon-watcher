# Pokémon stock watcher — what to watch.
# Edit products HERE, never in code. Secrets (Telegram token, chat id, ntfy
# topic) are NOT in this file: they come from GitHub secrets / env vars.
#
# shop_price = the normal shop price. Alerts fire up to over_price_tolerance
# above it (flagged as over); beyond that, daily report only. Leave it unset
# when the normal price isn't known yet — the alert then fires regardless.
#
# Total Cards products are read via search queries: each product's `query`
# must return its handle in the top 10 results. Verified 24 Oct 2026.

settings:
  cooldown_minutes: 30
  error_threshold: 5
  over_price_tolerance: 0.25
  not_seen_fallback_runs: 12
  sold_out_again_hours: 24
  report_hours: [9, 13, 17, 21]   # summaries to Telegram, UK time
  request_gap_seconds: 4

# Whole shop collections: every SEALED product in them is watched
# automatically, including ones the shop adds later. Single cards, empty tins,
# loose stickers/art cards, coins and non-English stock are skipped.
collections:
  - shop: totalcards
    handle: pokemon-30th-celebration
  - shop: zatu
    handle: pokemon-tcg-30th-celebration

# Price caps for collection products, by words in the product title. First
# match wins, so put specific words ("mini tin") before general ones ("tin").
# Over the cap = no alert, just shown in the summaries. No match = always alert.
price_caps:
  - {match: ultra premium, max: 160}
  - {match: booster box, max: 170}
  - {match: elite trainer box, max: 60}
  - {match: mini tin, max: 22}
  - {match: booster bundle, max: 30}
  - {match: booster pack, max: 6}
  - {match: binder, max: 55}
  - {match: poster collection, max: 55}
  - {match: battle deck, max: 25}
  - {match: ex box, max: 35}
  - {match: tin, max: 35}
  - {match: tech sticker, max: 30}
  - {match: blister, max: 30}

# Sets the Pokémon TCG API is asked about, to add set info, the chase cards
# and a card picture to BUY NOW alerts. Matched by name in the product title.
tcg_sets:
  - Delta Reign
  - 30th Celebration
  - Chaos Rising
  - Pitch Black
  - Perfect Order
  - Phantasmal Flames
  - Ascended Heroes
  - Prismatic Evolutions
  - Destined Rivals
  - Flowing Fists

