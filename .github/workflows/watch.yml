name: watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [once, test-notify, report-now]
        default: once

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check shops
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m pokemon_watcher.run --${{ inputs.mode || 'once' }}
      - name: Save state
        # Runs even if the check failed, so error counts persist. A failed push
        # fails the job, which GitHub emails about — state must never silently
        # stop saving, or every run becomes a fresh baseline.
        if: always() && (inputs.mode || 'once') == 'once'
        run: |
          git config user.name watcher
          git config user.email watcher@users.noreply.github.com
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: update"
          git pull --rebase --autostash
          git push
