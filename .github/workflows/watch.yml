name: watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [once, test-notify, test-buy-now, report-now]
        default: once

concurrency:
  # Checks share one queue (they save state.json). Manual modes don't save
  # state, so they get their own queue — otherwise GitHub's one-pending-run
  # rule lets the next scheduled check cancel a queued Pokédex update.
  group: ${{ (inputs.mode || 'once') == 'once' && 'watch' || 'watch-manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch tip when the job starts, not the sha it was triggered
          # at: a queued run must read the state the previous run saved.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check shops
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ inputs.mode || 'once' }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python -m pokemon_watcher.run "--$MODE"
      - name: Save state
        # Runs even if the check failed, so error counts persist. A failed push
        # fails the job, which GitHub emails about — state must never silently
        # stop saving, or every run becomes a fresh baseline.
        if: always() && (inputs.mode || 'once') == 'once'
        run: |
          git config user.name watcher
          git config user.email watcher@users.noreply.github.com
          git add state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: update"
          # If another commit landed first, rebase onto it and try again. On a
          # conflict this run's state wins (in a rebase, "theirs" is the commit
          # being replayed — ours). Three clashes in a row fails the job.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          exit 1
